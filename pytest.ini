[pytest]
addopts = --maxfail=20 --tb=short -q
pythonpath = .
asyncio_default_fixture_loop_scope = function
markers =
    smoke: quick smoke tests
    intent: intent parsing tests
    codegen: deterministic code template tests
    online: live external-service integration tests (opt-in)
    validation: data validation-engine tests ß
norecursedirs = archive